[unix_http_server]
file=/root/illegal_construction_inspection/.runtime-services/supervisor.sock
chmod=0600

[supervisord]
logfile=/root/illegal_construction_inspection/.runtime-services/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/root/illegal_construction_inspection/.runtime-services/supervisord.pid
childlogdir=/root/illegal_construction_inspection/.runtime-services
nodaemon=false
minfds=1024
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/illegal_construction_inspection/.runtime-services/supervisor.sock

[program:algorithm]
command=/bin/bash /root/illegal_construction_inspection/scripts/service/run_managed_algorithm.sh
directory=/root/illegal_construction_inspection
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=TERM
stopwaitsecs=60
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/root/illegal_construction_inspection/.runtime-services/algorithm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
priority=10

[program:adapter]
command=/bin/bash /root/illegal_construction_inspection/scripts/service/run_managed_adapter.sh
directory=/root/illegal_construction_inspection
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/illegal_construction_inspection/.runtime-services/adapter.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
priority=20
